# Per-package test matrix on BOTH database engines (the Asas dual-engine rule,
# inherited from Teamy — see DR 0017). Add new packages to matrix.package.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every exported symbol must appear in its package's doc page (DR 0002).
  # Cheap and independent of the test matrix: no services, no installs, one
  # AST parse per package. Only packages that already have a page under
  # docs/packages/ are gated, so adding this never turns the build red for
  # documentation nobody has written yet — a package starts being checked the
  # moment its page merges.
  docs:
    name: docs contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documented surface
        run: python tools/check_docs.py

  test:
    name: ${{ matrix.package }} (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [asas-lookups, asas-validation, asas-storage, asas-ratelimit, asas-jobs, asas-access, asas-workflow, asas-notifications, asas-search, asas-mcp]
        engine: [sqlite, postgres]

    services:
      # Started for both matrix legs; the sqlite leg simply never connects to it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: asas
          POSTGRES_PASSWORD: asas
          POSTGRES_DB: asas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/${{ matrix.package }}/pyproject.toml

      # Azure Blob emulator — asas-storage proves backend parity against a real
      # Blob endpoint (Azure has no moto equivalent). Not a `services:` entry
      # because Azurite needs arguments: the SDK sends a newer API version than
      # the emulator knows, so without --skipApiVersionCheck every request 400s
      # and the whole azure leg silently skips. Only started for the one package
      # that uses it; the fixture skips itself when nothing is listening.
      - name: Start Azurite
        if: matrix.package == 'asas-storage'
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.36.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          # `docker run -d` returns as soon as the container is *created* —
          # gate on the port actually accepting, or the whole azure leg
          # would silently skip with CI still green.
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/10000) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "Azurite never became ready:" >&2
          docker logs azurite >&2
          exit 1

      - name: Install package
        working-directory: packages/${{ matrix.package }}
        run: pip install -e '.[dev]'

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        env:
          TEST_DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgresql+psycopg2://asas:asas@localhost:5432/asas_test' || '' }}
          # An unreachable emulator normally skips the azure leg (local dev
          # convenience); in CI that skip must be a failure, or the only
          # behavioural coverage this backend has can vanish silently.
          ASAS_REQUIRE_AZURE: ${{ matrix.package == 'asas-storage' && '1' || '' }}
        run: pytest -q
