# Per-package test matrix on BOTH database engines (the Asas dual-engine rule,
# inherited from Teamy — see DR 0017). Add new packages to matrix.package.
#
# The `repo` job holds cross-package invariants, which the per-package matrix
# cannot see: each leg runs with a single package directory as its working
# directory. See tests/ at the repo root.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here reads the checkout and runs tests; none performs an
# authenticated git operation. Set once at the top so a new job inherits it.
permissions:
  contents: read

jobs:
  repo:
    name: repo-wide invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # No package installs: these tests read source files, they do not import
      # the packages, so they stay fast and cannot be broken by a bad install.
      - run: pytest tests/ -q

  test:
    name: ${{ matrix.package }} (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [asas-lookups, asas-validation, asas-storage, asas-ratelimit, asas-jobs, asas-access, asas-workflow, asas-notifications, asas-search, asas-mcp, asas-tenancy, asas-audit]
        engine: [sqlite, postgres]

    services:
      # Started for both matrix legs; the sqlite leg simply never connects to it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: asas
          POSTGRES_PASSWORD: asas
          POSTGRES_DB: asas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/${{ matrix.package }}/pyproject.toml

      # Azure Blob emulator — asas-storage proves backend parity against a real
      # Blob endpoint (Azure has no moto equivalent). Not a `services:` entry
      # because Azurite needs arguments: the SDK sends a newer API version than
      # the emulator knows, so without --skipApiVersionCheck every request 400s
      # and the whole azure leg silently skips. Only started for the one package
      # that uses it; the fixture skips itself when nothing is listening.
      - name: Start Azurite
        if: matrix.package == 'asas-storage'
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.36.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          # `docker run -d` returns as soon as the container is *created* —
          # gate on the port actually accepting, or the whole azure leg
          # would silently skip with CI still green.
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/10000) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "Azurite never became ready:" >&2
          docker logs azurite >&2
          exit 1

      # asas-tenancy and asas-audit both assert that Postgres row-level security
      # actually isolates, and the service container's POSTGRES_USER is a
      # SUPERUSER, which ignores RLS with FORCE set. Run as that role and every
      # isolation assertion would pass on a completely unprotected database,
      # which is the exact failure these packages exist to prevent. So those legs
      # get their own NOBYPASSRLS role, and a database it OWNS (both suites
      # recreate the public schema per test).
      - name: Provision the restricted RLS role
        if: (matrix.package == 'asas-tenancy' || matrix.package == 'asas-audit') && matrix.engine == 'postgres'
        env:
          PGPASSWORD: asas
        run: |
          psql -h localhost -U asas -d asas_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE asas_rls LOGIN PASSWORD 'asas_rls' NOSUPERUSER NOBYPASSRLS;
          SQL
          createdb -h localhost -U asas -O asas_rls asas_rls_test
          psql -h localhost -U asas -d asas_rls_test -v ON_ERROR_STOP=1 \
            -c "ALTER SCHEMA public OWNER TO asas_rls;"
          # Prove the role is what we think it is before the suite trusts it.
          PGPASSWORD=asas_rls psql -h localhost -U asas_rls -d asas_rls_test -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user" \
            | grep -qx f || { echo "asas_rls can bypass RLS; the suite would prove nothing" >&2; exit 1; }

      # asas-audit depends on asas-tenancy BY NAME (see the repo README): there is
      # no package index, so the sibling is installed from its local path first
      # and pip's name-only requirement is then already satisfied. This is the
      # same shape a consumer uses, where their own top-level git pin satisfies it.
      - name: Install sibling packages
        if: matrix.package == 'asas-audit'
        run: pip install -e packages/asas-tenancy

      - name: Install package
        working-directory: packages/${{ matrix.package }}
        run: pip install -e '.[dev]'

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        env:
          # asas-tenancy and asas-audit connect as the restricted role provisioned
          # above; every other package connects as the service's own user.
          TEST_DATABASE_URL: ${{ matrix.engine == 'postgres' && ((matrix.package == 'asas-tenancy' || matrix.package == 'asas-audit') && 'postgresql+psycopg2://asas_rls:asas_rls@localhost:5432/asas_rls_test' || 'postgresql+psycopg2://asas:asas@localhost:5432/asas_test') || '' }}
          # An unreachable emulator normally skips the azure leg (local dev
          # convenience); in CI that skip must be a failure, or the only
          # behavioural coverage this backend has can vanish silently.
          ASAS_REQUIRE_AZURE: ${{ matrix.package == 'asas-storage' && '1' || '' }}
          # Same rule for tenant isolation: locally a bypassing role is a
          # deliberate convenience and the isolation tests skip. In CI that skip
          # would mean the only coverage the boundary has had silently stopped
          # running, so on the postgres leg it is a failure instead.
          ASAS_REQUIRE_RLS: ${{ (matrix.package == 'asas-tenancy' || matrix.package == 'asas-audit') && matrix.engine == 'postgres' && '1' || '' }}
        run: pytest -q

  # asas-cli owns no schema and touches no database — it generates text files
  # and edits a pyproject.toml. Running it through the sqlite/postgres matrix
  # above would just execute the identical suite twice for no signal, so it
  # gets its own single-leg job instead.
  cli:
    name: asas-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/asas-cli/pyproject.toml

      - name: Install package
        working-directory: packages/asas-cli
        run: pip install -e '.[dev]'

      - name: Run tests
        working-directory: packages/asas-cli
        env:
          # The scaffold smoke test installs the generated project's pinned-tag
          # dependencies from the real remote — the consumer path that the
          # local-path jobs above structurally cannot cover. Network use is
          # opt-in so the suite stays runnable offline.
          ASAS_NETWORK_TESTS: "1"
        run: pytest -q

  selfcheck:
    # The host self-check (TEAMY-801). Installs the packages it inspects by
    # **local path, never a pinned tag**: a change that renames a version table
    # or a configure_* global must fail here on the PR that makes it, which is
    # the whole reason this suite is in this repository rather than shipped
    # separately.
    name: selfcheck (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: asas
          POSTGRES_PASSWORD: asas
          POSTGRES_DB: asas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the inspected packages from source
        run: |
          pip install pytest psycopg2-binary
          pip install \
            -e packages/asas-lookups \
            -e packages/asas-access \
            -e packages/asas-workflow \
            -e packages/asas-notifications \
            -e packages/asas-jobs \
            -e packages/asas-search \
            -e packages/asas-storage

      - name: Run tests
        working-directory: examples/selfcheck
        env:
          TEST_DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgresql+psycopg2://asas:asas@localhost:5432/asas_test' || '' }}
        run: pytest -q

  reference-host:
    # The reference host (TEAMY-801) — the executable definition of "the host
    # contract holds". Installs by local path, never a pinned tag, so a
    # contract break fails on the PR that caused it rather than at the next
    # release. Both engines: the Postgres leg additionally exercises the deep
    # search tier, which the SQLite leg must degrade away from cleanly.
    name: reference-host (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: asas
          POSTGRES_PASSWORD: asas
          POSTGRES_DB: asas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Relative paths in requirements.txt resolve against the working
      # directory, so this must run from the reference host's own directory.
      - name: Install (local path dependencies)
        working-directory: examples/reference-host
        # requirements.txt declares the postgres driver itself, so both matrix
        # legs install identically and a developer gets the same environment.
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: examples/reference-host
        env:
          TEST_DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgresql+psycopg2://asas:asas@localhost:5432/asas_test' || '' }}
        run: pytest -q
