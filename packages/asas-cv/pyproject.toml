[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-cv"
version = "0.1.0"
description = "Asas CV module: what a CV gives up before any model reads it, and the shape after. Text out of a PDF, Word or plain-text document with refusals that carry a code, the person's headshot lifted out of the document and never an exception, and the parsed CV's sections as Pydantic models with the durations and total experience computed rather than asked for."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "pdfminer.six>=20240706",
    "python-docx>=1.1",
    "Pillow>=10",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
