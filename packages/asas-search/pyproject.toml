[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-search"
version = "0.11.2"
description = "Asas search module: a cross-entity search engine with provider registry and rank tiers, plus an optional Postgres deep-content tier (bilingual FTS + pgvector semantic KNN with RRF fusion) behind a dialect-branched package Alembic chain."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
