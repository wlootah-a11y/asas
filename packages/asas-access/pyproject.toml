[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-access"
version = "0.15.1"
description = "Asas access-control module: configuration-driven field/action permissions and record visibility over one principal layer (roles, groups, host-registered relationship resolvers), with a package-owned Alembic chain."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_access"]

[tool.pytest.ini_options]
testpaths = ["tests"]
