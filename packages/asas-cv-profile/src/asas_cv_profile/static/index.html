<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV profile builder</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #e2e6ec;
  --accent: #1f5fbf; --hl: #fff2b8; --hl-ink: #1c2330;
  --ok: #1d7a46; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fff1d6;
  --bad: #b42318; --bad-bg: #fde7e5; --info: #3a4a63; --info-bg: #e8edf5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #9aa5b5; --line: #2b3340;
    --accent: #7fb0ff; --hl: #5a4a12; --hl-ink: #fff7d6;
    --ok: #7dd3a0; --ok-bg: #173526; --warn: #f0c46a; --warn-bg: #3a2e12;
    --bad: #ff9b91; --bad-bg: #3f1d1a; --info: #b9c6da; --info-bg: #243044;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
header form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input[type=file], button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
button[disabled] { opacity: .5; cursor: wait; }
label.inline { display: flex; gap: 4px; align-items: center; color: var(--muted); }
#status { color: var(--muted); }
#status.error { color: var(--bad); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 12px; padding: 12px 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
section.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.pane h2 { font-size: 14px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pane h2 a { font-weight: 400; color: var(--accent); margin-left: 8px; }
#text { font-family: var(--mono); font-size: 12.5px; max-height: calc(100vh - 150px); overflow: auto; padding: 6px 0; }
.ln { display: grid; grid-template-columns: 4.2em 1fr; gap: 8px; padding: 1px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ln .n { color: var(--muted); text-align: right; user-select: none; }
.ln.hl { background: var(--hl); color: var(--hl-ink); }
#profile { max-height: calc(100vh - 150px); overflow: auto; padding: 8px 12px 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 9px; margin: 4px 0; }
.cat { margin: 14px 0 4px; font-size: 15px; }
.entry { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
.entry > .head { padding: 7px 10px; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; border-bottom: 1px solid var(--line); }
.entry > .head .lines { color: var(--muted); font-family: var(--mono); font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 5px 10px; vertical-align: top; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
tr:first-child td { border-top: 0; }
td.label { width: 32%; color: var(--muted); }
td.value { white-space: pre-wrap; }
td.check { width: 1%; white-space: nowrap; }
tr.cell { cursor: pointer; }
tr.cell:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.b { font-size: 11.5px; border-radius: 4px; padding: 1px 6px; }
.b.verified, .b.computed { background: var(--ok-bg); color: var(--ok); }
.b.normalised { background: var(--info-bg); color: var(--info); }
.b.inferred { background: var(--warn-bg); color: var(--warn); }
.b.unverified, .b.bad_lines { background: var(--bad-bg); color: var(--bad); }
.calls td { font-size: 12.5px; }
.empty { color: var(--muted); padding: 24px 12px; }
[dir=auto] { unicode-bidi: plaintext; }
</style>
</head>
<body>
<header>
  <h1>CV profile builder</h1>
  <form id="f">
    <input type="file" id="file" name="file" accept=".pdf,.docx" required>
    <label class="inline" title="Three calls under 90 schema properties each, instead of one"><input type="checkbox" id="split"> split into 3 calls</label>
    <button id="go" type="submit">Read CV</button>
  </form>
  <select id="runs" title="Earlier runs"><option value="">Earlier runs</option></select>
  <label class="inline"><input type="checkbox" id="flagged"> only what needs a look</label>
  <span id="status"></span>
</header>
<main>
  <section class="pane">
    <h2><span>Text</span><span id="tlinks"></span></h2>
    <div id="text"><div class="empty">Upload a PDF or Word CV. The numbered text it was read as shows here.</div></div>
  </section>
  <section class="pane">
    <h2><span>Profile</span><span id="plinks"></span></h2>
    <div id="profile"><div class="empty">The profile shows here, each value with the lines it came from and its check.</div></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const NEEDS_LOOK = new Set(["unverified", "bad_lines", "inferred"]);
const FLAGS = { merged: "May be merged", twin: "Check the pairing" };
let current = null;

function status(msg, error = false) { const s = $("#status"); s.textContent = msg; s.className = error ? "error" : ""; }

function highlight(lines) {
  document.querySelectorAll(".ln.hl").forEach((n) => n.classList.remove("hl"));
  let first = null;
  for (const n of lines || []) {
    const row = document.getElementById("L" + n);
    if (row) { row.classList.add("hl"); first = first || row; }
  }
  if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
}

function links(run) {
  const a = (name, label) => el("a", { href: `/files/${encodeURIComponent(run)}/${name}`, text: label });
  $("#tlinks").replaceChildren(a("text.txt", "text.txt"));
  $("#plinks").replaceChildren(a("profile.json", "profile.json"), a("review.md", "review.md"));
}

function renderText(lines) {
  const box = $("#text");
  box.replaceChildren(...lines.map((t, i) =>
    el("div", { class: "ln", id: "L" + (i + 1) }, el("span", { class: "n", text: "L" + String(i + 1).padStart(3, "0") }), el("span", { dir: "auto", text: t }))));
}

function valueText(v) {
  if (v === null || v === undefined) return "";
  if (Array.isArray(v)) return v.join("; ");
  if (typeof v === "boolean") return v ? "Yes" : "No";
  return String(v);
}

function renderProfile(b) {
  const box = $("#profile");
  const only = $("#flagged").checked;
  const t = b.text;
  const counts = Object.entries(b.checks || {}).sort().map(([k, v]) => el("span", { class: "chip", text: `${k} ${v}` }));
  const meta = el("div", { class: "meta" },
    el("span", { class: "chip", text: `read by ${t.reader || t.converter}` }),
    el("span", { class: "chip", text: `${t.lines.length} lines` }),
    t.pages ? el("span", { class: "chip", text: `${t.pages} pages` }) : null,
    ...counts);
  const out = [meta];
  for (const w of t.warnings || []) out.push(el("div", { class: "warn", dir: "auto", text: w }));
  for (const c of b.calls || []) if (c.error) out.push(el("div", { class: "warn", text: `Call ${c.group} failed: ${c.error}` }));
  for (const [cat, subs] of Object.entries(b.profile || {})) {
    const catNodes = [];
    for (const [sub, node] of Object.entries(subs)) {
      const entries = Array.isArray(node) ? node : [node];
      entries.forEach((entry, i) => {
        const rows = [];
        for (const [label, cell] of Object.entries(entry.fields || {})) {
          if (only && !NEEDS_LOOK.has(cell.check)) continue;
          const cellLines = cell.lines && cell.lines.length ? cell.lines : entry.lines;
          const tr = el("tr", { class: "cell" },
            el("td", { class: "label", text: label }),
            el("td", { class: "value", dir: "auto", text: valueText(cell.value) }),
            el("td", { class: "check" }, el("span", { class: "b " + cell.check, text: cell.check })));
          tr.addEventListener("click", (e) => { e.stopPropagation(); highlight(cellLines); });
          rows.push(tr);
        }
        const flags = (entry.flags || []).map((f) => el("div", { class: "warn", text: (FLAGS[f.code] || "Check") + ": " + f.message }));
        if (!rows.length && !flags.length) return;
        const head = el("div", { class: "head" },
          el("strong", { text: sub + (Array.isArray(node) ? ` #${i + 1}` : "") }),
          el("span", { class: "lines", text: entry.lines && entry.lines.length ? "lines " + entry.lines.join(", ") : "" }));
        head.addEventListener("click", () => highlight(entry.lines));
        catNodes.push(el("div", { class: "entry" }, head, ...flags, el("table", {}, el("tbody", {}, ...rows))));
      });
    }
    if (catNodes.length) out.push(el("h3", { class: "cat", text: cat }), ...catNodes);
  }
  const calls = el("table", { class: "calls" }, el("tbody", {},
    el("tr", {}, ...["Call", "Properties", "Seconds", "Tokens in / out"].map((h) => el("td", { class: "label", text: h }))),
    ...(b.calls || []).map((c) => el("tr", {},
      el("td", { text: c.group }), el("td", { text: String(c.properties) }), el("td", { text: String(c.seconds) }),
      el("td", { text: `${(c.usage || {}).input_tokens || 0} / ${(c.usage || {}).output_tokens || 0}` })))));
  out.push(el("h3", { class: "cat", text: "Calls" }), el("div", { class: "entry" }, calls));
  box.replaceChildren(...out);
}

function show(b) {
  current = b;
  renderText(b.text.lines);
  renderProfile(b);
  links(b.run);
}

async function loadRuns(select) {
  const r = await fetch("/api/runs");
  const runs = await r.json();
  $("#runs").replaceChildren(el("option", { value: "", text: "Earlier runs" }), ...runs.map((x) => el("option", { value: x.run, text: x.run })));
  if (select) $("#runs").value = select;
}

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = $("#file").files[0];
  if (!f) return;
  const body = new FormData();
  body.append("file", f);
  body.append("split", $("#split").checked ? "true" : "false");
  $("#go").disabled = true;
  const started = Date.now();
  const tick = setInterval(() => status(`Reading ${f.name}… ${Math.round((Date.now() - started) / 1000)}s`), 1000);
  try {
    const r = await fetch("/api/parse", { method: "POST", body });
    const b = await r.json();
    if (!r.ok) throw new Error((b.detail && (b.detail.message || b.detail)) || r.statusText);
    show(b);
    status(`Done in ${Math.round((Date.now() - started) / 1000)}s.`);
    loadRuns(b.run);
  } catch (err) {
    status(String(err.message || err), true);
  } finally {
    clearInterval(tick);
    $("#go").disabled = false;
  }
});

$("#runs").addEventListener("change", async (e) => {
  if (!e.target.value) return;
  const r = await fetch("/api/runs/" + encodeURIComponent(e.target.value));
  if (r.ok) { show(await r.json()); status(""); } else status("Could not open that run.", true);
});

$("#flagged").addEventListener("change", () => { if (current) renderProfile(current); });
const asked = new URLSearchParams(location.search).get("run");
loadRuns(asked).then(() => { if (asked) $("#runs").dispatchEvent(new Event("change")); });
</script>
</body>
</html>
