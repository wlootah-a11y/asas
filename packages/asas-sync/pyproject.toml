[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-sync"
version = "0.1.0"
description = "Asas sync module: mirror a remote paginated collection into the host's tables incrementally, with walk orders that survive unstable tie order, an offset-ceiling re-anchor, a watermark that never passes the walk's start, two-miss deletion reconcile, resumable passes and a portable lease."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
