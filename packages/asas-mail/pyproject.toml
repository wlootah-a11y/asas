[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-mail"
version = "0.1.0"
description = "Asas mail module: render a message from a host's Jinja templates inside a shell and send it through one seam, with a Microsoft Graph sendMail transport on asas-graph, a file outbox for a laptop, an off transport that refuses as a skip rather than a retry, a redirect that pins every message to one mailbox, and attachments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "jinja2>=3.1",
]

[project.optional-dependencies]
graph = [
    "asas-graph>=0.1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_mail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
