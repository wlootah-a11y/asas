<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{ email_title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
        }
        .header {
            /* Outlook drops the gradient; the solid colour under it keeps the
               white title readable there instead of a blank box. */
            background-color: #16213e;
            background-image: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 4px solid #0f3460;
        }
        .header h1 { margin: 0; font-size: 28px; color: #ffffff; }
        .header p { font-size: 16px; color: #b0b0b0; margin: 10px 0 0 0; }
        .content { padding: 32px 30px; text-align: left; }
        .footer {
            padding: 20px 30px;
            font-size: 12px;
            color: #888888;
            border-top: 1px solid #e0e0e0;
            text-align: center;
        }
        a { color: #0f3460; }
    </style>
</head>
<body>
    <div class="container">
        {% if show_header %}
        <div class="header">
            <h1>{{ email_title }}</h1>
            {% if email_subtitle %}<p>{{ email_subtitle }}</p>{% endif %}
        </div>
        {% endif %}
        <div class="content">
            {{ body | safe }}
        </div>
        {% if recipient %}
        <div class="footer">
            This message was sent to {{ recipient }}.
        </div>
        {% endif %}
    </div>
</body>
</html>
