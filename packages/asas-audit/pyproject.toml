[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-audit"
version = "0.1.0"
description = "Asas audit module: an append-only, per-tenant hash-chained record of business actions that commits with the change it describes, with edits and deletes refused by the database and a verification report that names the row where history stops adding up."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.110,<1",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    # Declared by NAME, not by git URL. The family is installed by git URL with
    # no package index, so a URL here would hardcode the upstream remote (which
    # a consumer mirroring this repo internally rewrites) and would pin one
    # tenancy tag per audit release. A name-only requirement is satisfied by the
    # consumer's own top-level pin, which is how every package in this family is
    # already installed, and `asas add audit` adds both.
    "asas-tenancy>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
