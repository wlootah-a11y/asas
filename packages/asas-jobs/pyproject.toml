[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-jobs"
version = "0.11.1"
description = "Asas background-jobs module: a durable DB-backed job queue and interval scheduler with CAS claims, lease-based crash recovery, retry backoff with dead-lettering, and a package-owned Alembic chain."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "sqlmodel>=0.0.21,<0.0.45",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
