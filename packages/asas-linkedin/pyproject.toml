[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-linkedin"
version = "0.1.0"
description = "Asas LinkedIn module, the generic half of LinkedIn for a hiring product: Sign in with LinkedIn (OpenID Connect against the live discovery document and published keys), Apply with LinkedIn (the signed profile checked and reduced to mapped fields), posting as an organization Page (the token grant, little-text escaping, the article post body, the token sealed at rest), and the Jobs XML feed for Job Wrapping."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_linkedin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
