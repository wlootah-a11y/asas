[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-storage"
version = "0.15.1"
description = "Asas storage module: a pluggable file/object storage seam with on-disk, S3-compatible and Azure Blob backends behind one traversal-safe contract."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.15"]
dev = [
    "pytest>=8",
    "moto[s3]>=5.0",
    "boto3>=1.34",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
