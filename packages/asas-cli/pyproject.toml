[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-cli"
version = "0.1.1"
description = "Developer CLI for Asas: pin a package into an existing project (`asas add`), or scaffold a new FastAPI project pre-wired for a chosen set of packages (`asas new`)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
asas = "asas_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asas_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
