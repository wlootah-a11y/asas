[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-uaepass"
version = "0.1.0"
description = "Asas UAE PASS module: the national digital identity as a sign-in. The authorization-code exchange exactly as UAE PASS documents it, typed refusals with a log-only reason, the user information parsed and normalised into identity facts (E.164 mobiles, positional full names, alpha-3 nationalities from UAE PASS's own list), and nothing secret in any log."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_uaepass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
