[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-validation"
version = "0.11.1"
description = "Asas validation module: declarative temporal/cross-field rules evaluated on both create and update, with a FastAPI endpoint serving the rule set so clients enforce the same constraints."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.110,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
