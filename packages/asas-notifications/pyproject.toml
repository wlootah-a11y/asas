[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-notifications"
version = "0.16.1"
description = "Asas notifications module: a generic notification engine — registered kinds, transactional emits with visibility filtering and unread coalescing, an in-app feed API, and a duplicate-safe per-channel delivery outbox with pluggable adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.110,<1",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_notifications"]

[tool.pytest.ini_options]
testpaths = ["tests"]
