[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-notifications"
version = "0.20.1"
description = "Asas notifications module: a generic notification engine — registered kinds, transactional emits with visibility filtering and unread coalescing, an in-app feed API, and a duplicate-safe per-channel delivery outbox with pluggable adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.110,<1",
    "sqlmodel>=0.0.21,<0.0.45",
    "alembic>=1.13",
]

[project.optional-dependencies]
# The async twins (asas_notifications.aio, DR 0005): SQLAlchemy's greenlet
# bridge. The async driver is the host's own.
async = ["sqlalchemy[asyncio]>=2.0"]
# migrate(tenant_guc=...) writes its policies with asas-tenancy. Named, not
# pinned: there is no package index, so a host's own git pin satisfies it (the
# asas-audit arrangement, see the repo README).
tenancy = ["asas-tenancy>=0.1"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_notifications"]

[tool.pytest.ini_options]
testpaths = ["tests"]
